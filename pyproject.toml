[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uncloak"
version = "0.1.0"
description = "Autonomous C2 Stealth Jitter Detection & Win32 Socket Attribution Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Uncloak Core Team" },
]
keywords = [
    "cybersecurity",
    "threat-hunting",
    "c2-detection",
    "blue-team",
    "network-security",
    "socket-attribution",
    "win32",
    "jitter-analysis",
    "edr"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "scapy>=2.5.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
build = [
    "pyinstaller>=6.5.0",
]

[project.scripts]
uncloak = "uncloak.cli.parser:main"

[project.urls]
Homepage = "https://github.com/uncloak-project/uncloak"
Documentation = "https://github.com/uncloak-project/uncloak/tree/main/docs"
Repository = "https://github.com/uncloak-project/uncloak.git"
Issues = "https://github.com/uncloak-project/uncloak/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/uncloak"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
